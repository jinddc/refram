<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Motion Lab standalone reveal playground"
    />
    <title>Motion Lab — Standalone Reveal</title>
    <link rel="stylesheet" href="/playground/standalone-reveal.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">Motion Unit 001 / Standalone Reveal</p>
        <motion-reveal>
          <h1>Content stays semantic. Motion stays owned.</h1>
        </motion-reveal>
        <motion-reveal id="advanced-reveal">
          <p class="intro">
            The first block uses defaults. This block receives typed options
            before the Custom Element is registered.
          </p>
        </motion-reveal>
      </header>

      <section class="evidence" aria-labelledby="evidence-title">
        <div class="section-heading">
          <p class="eyebrow">Multiple-instance evidence</p>
          <h2 id="evidence-title">Twenty independent observers</h2>
        </div>
        <div id="reveal-grid" class="reveal-grid"></div>
      </section>
    </main>

    <script type="module" src="/playground/standalone-reveal.ts"></script>
  </body>
</html>
