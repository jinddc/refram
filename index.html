<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Refram visual timeline debugger playground" />
    <title>Refram Playground</title>
    <link rel="stylesheet" href="/playground/devtools-editor-v2-fixture.css" />
  </head>
  <body>
    <div id="devtools-v2-sources">
      <section id="devtools-v2-finite" class="devtools-v2-stage" aria-label="Editorial sequence preview">
        <article class="devtools-v2-panel" data-label="Something" data-key="something-1"><h2>Map the opening.</h2></article>
        <article class="devtools-v2-panel"><h2>Inspect the overlap.</h2></article>
        <article class="devtools-v2-panel"><h2>Resolve the motion.</h2></article>
      </section>
      <section id="devtools-v2-particles" class="devtools-v2-particles" aria-label="Particle cycle preview">
        <canvas id="devtools-v2-canvas" aria-hidden="true"></canvas>
        <p class="devtools-v2-particles__label">99 particle cycle</p>
      </section>
      <section id="devtools-v2-window-scroll" class="devtools-v2-scroll-stage" aria-label="Window ScrollTrigger preview">
        <h2>Window scrub</h2>
      </section>
      <section id="devtools-v2-custom-scroll" class="devtools-v2-scroll-stage" aria-label="Custom scroller ScrollTrigger preview">
        <div id="devtools-v2-custom-scroller" class="devtools-v2-custom-scroller">
          <div class="devtools-v2-custom-spacer" aria-hidden="true"></div>
          <article id="devtools-v2-custom-trigger"><h2>Custom scrub</h2></article>
          <div class="devtools-v2-custom-spacer" aria-hidden="true"></div>
        </div>
      </section>
      <section id="devtools-v2-action-scroll" class="devtools-v2-scroll-stage" aria-label="Trigger action ScrollTrigger preview">
        <h2>Trigger actions</h2>
      </section>
    </div>
    <script type="module" src="/playground/devtools-editor-v2-fixture.ts"></script>
  </body>
</html>
