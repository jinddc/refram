<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Motion Lab scroll-scrubbed canvas image sequence study" />
    <title>Image Sequence — Motion Lab</title>
    <link rel="stylesheet" href="/playground/image-sequence.css" />
  </head>
  <body>
    <header class="sequence-header">
      <a href="/motion-devtools.html">← Motion DevTools</a>
      <span>Motion Lab / Study 06</span>
    </header>
    <main>
      <div class="sequence-intro">
        <p>Scroll / Canvas / 147 frames</p>
        <h1>Image sequence</h1>
        <span>Scroll to scrub the sequence ↓</span>
      </div>
      <div class="sequence-stage">
        <canvas
          id="image-sequence"
          width="1158"
          height="770"
          role="img"
          aria-label="Scroll-controlled image sequence showing a rotating object"
        ></canvas>
        <div class="sequence-readout" aria-hidden="true">
          <span>FRAME</span>
          <output id="sequence-frame">001 / 147</output>
        </div>
        <p id="sequence-asset-status" class="sequence-asset-status">Preparing frames…</p>
      </div>
      <div class="sequence-scroll-space" aria-hidden="true"></div>
    </main>
    <footer class="sequence-footer">
      Study adapted from
      <a href="https://codepen.io/GreenSock/pen/VwgevYW" target="_blank" rel="noreferrer">GreenSock’s image-sequence helper</a>.
      Original frames are hosted by Apple; a procedural fallback is used when unavailable.
    </footer>
    <script type="module" src="/playground/image-sequence.ts"></script>
  </body>
</html>
