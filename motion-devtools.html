<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Motion Lab internal video-editor Motion DevTools prototype"
    />
    <title>Motion Lab DevTools</title>
    <link rel="stylesheet" href="/playground/motion-devtools.css" />
  </head>
  <body>
    <div id="motion-devtools-root"></div>
    <div id="motion-source-home" hidden>
      <div id="editor-stage" class="motion-editor-fixture">
        <article id="opening" class="motion-editor-fixture__panel">
          <span class="motion-editor-fixture__index">A</span>
          <h2>Shape the opening.</h2>
          <p>Start with hierarchy, then slow the sequence down until every transition reads.</p>
        </article>
        <article id="focus" class="motion-editor-fixture__panel">
          <span class="motion-editor-fixture__index">B</span>
          <h2>Inspect the overlap.</h2>
          <p>Authored position and resolved time stay visible together.</p>
        </article>
        <article id="resolve" class="motion-editor-fixture__panel">
          <span class="motion-editor-fixture__index">C</span>
          <h2>Land on intent.</h2>
          <p>The preview remains the real DOM, not a captured replacement.</p>
        </article>
      </div>
    </div>

    <script type="module" src="/playground/motion-devtools-fixture.ts"></script>
  </body>
</html>
